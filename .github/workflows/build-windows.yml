name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --linker hoisted --ignore-scripts

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          $base = (git show upstream/dev:packages/opencode/package.json | ConvertFrom-Json).version
          $win = 1
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $idx = $tag.LastIndexOf(".w")
            if ($idx -ge 0) { $win = [int]$tag.Substring($idx + 2) }
          }
          $version = "$base.w$win"
          echo "value=$version" >> $env:GITHUB_OUTPUT
          Write-Output "base=$base win=$win version=$version"

      - name: Build
        shell: pwsh
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.value }}
          MODELS_DEV_API_JSON: ${{ vars.MODELS_DEV_API_JSON }}
        run: bun ./packages/opencode/script/build.ts --single --skip-embed-web-ui

      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "packages/opencode/dist/opencode-windows-x64/bin/*" -DestinationPath ("opencode-windows-x64-" + "${{ github.ref_name }}" + ".zip") -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-windows-x64-*.zip
          generate_release_notes: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
